[tools]
go = "1.27.1"
"npm:backlog.md" = "latest"
lefthook = "latest"
staticcheck = "2026.2.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
lima = "latest"

[tasks]
cli = "go run ./cmd/worklease"
lint = "staticcheck ./..."
format = "files=$(find cmd internal -type f -name '*.go'); gofmt -w $files"
format-check = "test -z \"$(find cmd internal -type f -name '*.go' -exec gofmt -l {} +)\""
test = "go test ./..."
typecheck = "go vet ./..."
hooks-install = "lefthook install"
hooks = "lefthook run pre-commit"
hooks-all = "lefthook run pre-commit --all-files"
build = "CGO_ENABLED=0 go build -trimpath -o bin/worklease ./cmd/worklease"
man = "mkdir -p dist && go run ./cmd/worklease-man --version dev > dist/worklease.1"
smoke = { run = "go run ./cmd/worklease-smoke --binary ./bin/worklease --version dev", depends = ["build"] }
remote-smoke = { run = "go run ./cmd/worklease-remote-smoke --binary ./bin/worklease", depends = ["build"] }
remote-smoke-vm = { run = "scripts/test-remote-vm.sh", depends = ["build"] }
authority-benchmark = { run = "python3 scripts/authority-queue-benchmark.py --binary ./bin/worklease --output /tmp/worklease-authority-$(date +%s)-$$", depends = ["build"] }
doc-test = { run = "go run ./cmd/worklease-doc-test", depends = ["build"] }
e2e = "scripts/test-e2e.sh"
release = "go run ./cmd/worklease-release"
race = "go test -race ./..."
vuln = "govulncheck ./..."
ci = { depends = ["format-check", "lint", "typecheck", "test", "race", "vuln", "e2e", "man"] }
