# yaml-language-server: $schema=https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        for f in {staged_files}; do
          if test -f "$f"; then test -z "$(gofmt -l "$f")" || exit 1; fi
        done
    # Vet, lint, and test only packages with staged Go files; CI runs the full suite.
    affected:
      glob: "*.go"
      run: |
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
        pkgs=$(for f in {staged_files}; do if test -f "$f"; then dirname "$f"; fi; done | sort -u | sed 's|^|./|')
        if test -n "$pkgs"; then
          mise exec -- go vet $pkgs && mise exec -- staticcheck $pkgs && mise exec -- go test -p 1 -parallel 2 $pkgs
        fi
    full:
      glob: ["go.mod", "go.sum"]
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE mise run test
