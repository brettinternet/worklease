name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
      - name: Install and exercise repository hooks
        run: |
          mise run hooks-install
          mise run hooks-all
      - name: Run quality gates, race tests, and end-to-end smoke
        run: mise run ci
      - name: Validate generated manual
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes groff-base
            groff -mandoc -Tutf8 dist/worklease.1 >/dev/null
          else
            mandoc -Tlint dist/worklease.1
          fi
