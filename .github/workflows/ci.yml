# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only PR runs supersede each other. A release reuses its commit's main CI,
  # so a later main push must not cancel or replace that run.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
