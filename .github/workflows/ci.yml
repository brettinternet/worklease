name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
      - name: Cache Go dependencies and builds
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install and exercise repository hooks
        run: |
          mise run hooks-install
          mise run hooks-all
      - name: Run quality gates, race tests, and end-to-end smoke
        run: mise run ci
      - name: Validate generated manual
        run: |
          sudo apt-get update
          sudo apt-get install --yes groff-base
          groff -mandoc -Tutf8 dist/worklease.1 >/dev/null

  queue-benchmark:
    name: Queue relative benchmarks (linux-x64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Compare on the same runner
        env:
          QUEUE_BENCH_SAMPLES: '3'
        run: |
          if test -f base/scripts/queue-benchmark.py; then
            (cd base && python3 scripts/queue-benchmark.py > ../base.json)
            python3 scripts/queue-benchmark.py > head.json
            python3 scripts/queue-benchmark-compare.py base.json head.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'No base benchmark yet; relative comparisons begin after this lands.' >> "$GITHUB_STEP_SUMMARY"
          fi

  compatibility:
    name: Test (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
      - name: Cache Go dependencies and builds
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Run platform tests and static build
        run: |
          mise run beads-check
          go test ./...
          mise run build
