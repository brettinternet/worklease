name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag/version to validate without publication
        required: true
        default: v0.10.0
        type: string

permissions:
  actions: read
  contents: read

jobs:
  go-assets:
    name: Go archive (${{ matrix.platform }}-${{ matrix.asset_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset_arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            asset_arch: arm64
          - os: macos-15-intel
            platform: macos
            asset_arch: x64
          - os: macos-14
            platform: macos
            asset_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with: { cache: true }
      - name: Build CGO-disabled archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          go run ./cmd/worklease-release --version "$version" --commit "$GITHUB_SHA" --current
          go test ./internal/release -run TestCreateArchiveUsesStableInstallMembersAndVerifiedChecksums
      - name: Install and smoke-test archive
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          version=${RELEASE_TAG#v}
          archive="dist/release/worklease-v${version}-${PLATFORM}-${ASSET_ARCH}.tar.gz"
          mkdir -p "$RUNNER_TEMP/worklease-install"
          tar -xzf "$archive" -C "$RUNNER_TEMP/worklease-install"
          go run ./cmd/worklease-smoke --binary "$RUNNER_TEMP/worklease-install/bin/worklease" --version "$version"
      - name: Validate rendered manual
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes groff-base
            groff -mandoc -Tutf8 dist/release/worklease.1 >/dev/null
          else
            mandoc -Tlint dist/release/worklease.1
          fi
      - name: Upload Go archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-go-${{ matrix.platform }}-${{ matrix.asset_arch }}
          path: dist/release/worklease-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish explicitly authorized tagged release
    if: github.event_name == 'push'
    needs: [go-assets]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Verify CI passed for tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-go-*
          path: dist/release
          merge-multiple: true
      - name: Generate complete checksums
        run: |
          cd dist/release
          sha256sum worklease-*.tar.gz > checksums.txt
          sha256sum --check checksums.txt
      - name: Publish immutable assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/release/worklease-*.tar.gz
            dist/release/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
